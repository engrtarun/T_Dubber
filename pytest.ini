; One command has to mean one thing.
;
; MEASURED 2026-10-09: a bare `pytest` in this repo root collected 13 vendored
; sub-projects (mazinger/tests, references/pyvideotrans/tests, three copies of
; mazinger inside projects/*/dataset_safe/...) and died with "Interrupted: 13
; errors during collection" -- so the suite could not be run at all, and the
; files that DO pass were invisible. testpaths says what "the suite" means;
; norecursedirs says what is not ours to run.
;
; Two files are deliberately NOT listed, because they are scripts against real
; systems rather than tests:
;
;   dashboard_contract_test.py  needs a LIVE dashboard server on :8081
;   test_tg_cloud.py            drives the real upload/restore code
;   test_upload.py              shells out to the uploader
;
; Run those by hand, exactly as their docstrings say.
[pytest]
testpaths =
    test_p0_direct.py
    test_db.py
    test_archive_roundtrip.py
    test_tgup_session_state.py
    test_tgup_url.py
    test_direct_archive.py
    test_flow_order.py
    test_tgup.py
    test_ui_static.py
    test_channel_caption.py
    multitasker_test.py
    huggingface/test_hf_store.py
norecursedirs =
    mazinger
    references
    Index-Translate
    projects
    archive
    kaggle_test_dataset
    Kaggle Tests Case
    _pack_stage
    edge
    .git
    __pycache__
    node_modules