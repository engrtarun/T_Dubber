# =============================================================================
#  build-native.yml -- compile every native tool in the cloud
# =============================================================================
#  Why this file exists: the dev machine has no cargo, no rustc, no cmake and
#  no docker, so `stitcher.exe`, `subtitle_forge.exe`, `havaldar_core.exe`,
#  `normalizer.exe` and the Kaggle Linux pack were unbuildable locally. GitHub's
#  runners carry all of them, so compilation moves here.
#
#  Three independent jobs, deliberately not a matrix:
#    python-tests          -> the stdlib-only test suite (fastest, no toolchain)
#    windows-native-tools  -> the four .exe files used locally
#    kaggle-tdubber-pack   -> the six static linux/amd64 binaries for Kaggle
#  They share no cache and do not gate each other: a C++ failure must not stop
#  you getting the Windows binaries, and vice versa. Hence `needs: []`.
#
#  Triggers: every push to main (as requested), plus pull_request for the four
#  source trees, plus manual dispatch.
# =============================================================================

name: build-native

on:
  push:
    branches: [main]
    paths-ignore:
      # Rebuilding six binaries because a README changed wastes runner minutes.
      # Remove this filter if you would rather always rebuild.
      #
      # NOTE: this workflow file must NOT be listed here. Listing it means a
      # commit whose ONLY change is build-native.yml does not trigger a run at
      # all -- so fixing the workflow appears to do nothing, which is a very
      # confusing way to spend an afternoon. Doc-only paths are safe to skip;
      # the workflow's own definition is not.
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths:
      - 'stitcher/**'
      - 'subtitle_forge/**'
      - 'havaldar_core/**'
      - 'cpp_accelerator/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-native.yml'
      # The stdlib-only suite. These four tests import nothing but the standard
      # library and repo-local modules, so they need no runner toolchain and
      # cost a few seconds -- worth running whenever the code they cover moves.
      - 'test_ui_static.py'
      - 'tests/test_subtitle_forge_*.py'
      - 'tests/lint_subtitle_forge_source.py'
      - 'ui_static.py'
      - 'ui_static/**'
      - 'subtitle_forge/src/**'
  workflow_dispatch:
    inputs:
      cmake_build_type:
        description: 'CMake build type for normalizer.exe'
        type: choice
        options: [Release, RelWithDebInfo]
        default: Release

# Least privilege. This workflow only reads the repo and uploads artifacts; it
# never pushes code, so `contents: write` would be wrong.
permissions:
  contents: read

# A second push makes the first push's binaries irrelevant, and runner minutes
# are the scarce resource.
concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # JOB 1 -- Windows binaries for local use
  # ===========================================================================
  windows-native-tools:
    name: Windows .exe (stitcher, subtitle_forge, havaldar_core, normalizer)
    runs-on: windows-latest
    # A cold cargo build of three independent crates plus CMake. Generous guard
    # against a hung runner, not an expectation.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # windows-latest images already carry a pinned stable Rust and MSVC, so
      # there is nothing to install. Logging the versions is more useful than a
      # silent toolchain upgrade: a build that starts failing after an unrelated
      # runner image bump is otherwise very hard to diagnose.
      - name: Report toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== toolchain ==="
          rustc --version
          cargo --version
          cmake --version | Select-Object -First 1
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { Write-Host "cl: $($cl.Source)" }
          else { Write-Host "cl: not on PATH (normal; MSVC is present via vswhere)" }

      # One cache entry per crate. There is no root Cargo.toml, so the three
      # crates are independent; a shared target dir would only cause lock
      # contention and cache thrash.
      - name: Cache cargo registry and build dirs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            stitcher -> target
            subtitle_forge -> target
            havaldar_core -> target
          cache-on-failure: true

      # Cargo.lock is committed for all three crates now, so there is nothing to
      # resolve. The `cargo generate-lockfile` step that used to live here was
      # actively harmful, not merely redundant: it re-resolves every dependency
      # to the newest version each manifest allows, throwing away the pinned
      # versions the lockfile exists to protect. A new patch release on any
      # transitive dependency could then change behaviour, or break the build,
      # with no commit to blame.
      #
      # This step just proves the lockfiles are present, so their absence fails
      # with a clear message instead of a confusing `--locked` error later.
      - name: Verify committed lockfiles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($crate in @("stitcher", "subtitle_forge", "havaldar_core")) {
            $lock = Join-Path $crate "Cargo.lock"
            if (-not (Test-Path $lock)) {
              throw "$lock is missing. It must be committed -- the crates are built with --locked."
            }
            Write-Host ("  ok: {0} ({1:N0} bytes)" -f $lock, (Get-Item $lock).Length)
          }

      # `--locked` is now safe and correct: it turns "someone edited a manifest
      # without re-locking" into a loud failure at the crate that caused it,
      # rather than a silent dependency upgrade inside a build that is supposed
      # to be reproducible.
      - name: Build Rust binaries (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($crate in @("stitcher", "subtitle_forge", "havaldar_core")) {
            Push-Location $crate
            Write-Host "=== cargo build --release --locked: $crate ==="
            cargo build --release --locked
            $exe = "target\release\$crate.exe"
            # A missing binary is otherwise a silent failure: the upload step
            # would just ship three files instead of four.
            if (-not (Test-Path $exe)) {
              throw "$crate.exe was not produced at $exe"
            }
            Write-Host ("  -> {0}  {1:N0} bytes" -f $exe, (Get-Item $exe).Length)
            Pop-Location
          }

      # Prove each binary actually starts. One that links but cannot run -- a
      # missing DLL, a bad subsystem -- passes the build and then fails on your
      # machine, where you have no toolchain to debug it with.
      #
      # These three tools do NOT share a command-line interface, so a uniform
      # `--version` probe is wrong for one of them:
      #
      #   subtitle_forge, havaldar_core   clap 4 derive -- `--version` works
      #   stitcher                        NO clap dependency at all; it
      #                                   hand-rolls env::args() and treats
      #                                   EVERY argument as a timeline path, so
      #                                   `--version` makes it try to open a
      #                                   file literally named "--version" and
      #                                   exit 2.
      #
      # That is not cosmetic. GitHub appends `exit $LASTEXITCODE` to every pwsh
      # step, so the last native command's exit code becomes the step's. Bare
      # `stitcher` prints its usage line and exits 1 BY DESIGN, so probing every
      # binary with `--version` and then running stitcher bare failed this step
      # with "Process completed with exit code 1" while all three binaries were
      # in fact built and working.
      #
      # So the assertion is per-tool, and the step ends with an explicit exit 0.
      #
      # `stitcher` is invoked bare on purpose: running `havaldar_core` bare
      # would BOOT its telemetry daemon and hang the job.
      - name: Smoke-test the Rust binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $probes = @(
            @{ crate = "stitcher";       argv = @();          expect = "usage" },
            @{ crate = "subtitle_forge"; argv = @("--version"); expect = "subtitle_forge" },
            @{ crate = "havaldar_core";  argv = @("--version"); expect = "havaldar_core" }
          )

          $problems = @()
          foreach ($probe in $probes) {
            $exe = ".\$($probe.crate)\target\release\$($probe.crate).exe"
            if (-not (Test-Path $exe)) {
              $problems += "$($probe.crate): not found at $exe"
              continue
            }

            # Splat with @argv, NOT @(...): `@(...)` is an array subexpression
            # and would pass the array itself as one single argument.
            $argv = $probe.argv
            $out = (& $exe @argv 2>&1 | Out-String)
            $code = $LASTEXITCODE
            $say = (($out -split "\r?\n") | Where-Object { $_.Trim() } | Select-Object -First 1)

            Write-Host ("  {0,-16} exit={1,-4} {2}" -f $probe.crate, $code, $say)

            if ($out -notmatch [regex]::Escape($probe.expect)) {
              $problems += "$($probe.crate): expected '$($probe.expect)' in its output"
            }
          }

          if ($problems.Count -gt 0) {
            foreach ($p in $problems) { Write-Host "SMOKE FAIL: $p" }
            throw "Rust binary smoke test failed ($($problems.Count) problem(s))"
          }
          Write-Host "all three Rust binaries start and identify themselves"
          exit 0

      - name: Build normalizer.exe with CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = "${{ inputs.cmake_build_type || 'Release' }}"

          # Built OUT OF TREE, never inside cpp_accelerator/.
          #
          # CMakeCache.txt records absolute paths and cmake refuses to configure
          # when the directory it finds the cache in is not the directory the
          # cache was created in. This repo had exactly that failure: a committed
          # cpp_accelerator/build/CMakeCache.txt pointed at
          # 'C:/Program Files/Git/mingw64/lib/Git/cmake-build/...' -- a
          # Git-Bash-mangled path from the machine that created it -- so it
          # could never match any CI runner and the step died in one second.
          #
          # The cache file is now untracked and gitignored, but an out-of-tree
          # build directory removes the whole class of problem: nothing can
          # commit a build tree into it and nothing can restore one over it.
          #
          # Under GITHUB_WORKSPACE rather than RUNNER_TEMP, because MSBuild
          # objects to an output directory in the temp directory:
          #   warning MSB8029: The intermediate directory or Output directory
          #   cannot reside under the Temporary directory as it could lead to
          #   issues with incremental build.
          # What actually matters is only that it is outside cpp_accelerator/ --
          # an in-source-tree build directory is exactly how a committed
          # CMakeCache.txt reached CI in the first place.
          $buildDir = Join-Path $env:GITHUB_WORKSPACE ".build\normalizer"
          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir }

          cmake -S cpp_accelerator -B $buildDir -DCMAKE_BUILD_TYPE=$cfg
          cmake --build $buildDir --config $cfg --parallel --target normalizer

          # A single-config generator (Ninja, Makefiles) writes the binary
          # straight into the build root; a multi-config one (MSVC, Ninja
          # Multi-Config) puts it in a per-config subdirectory. Accept either
          # rather than assuming, which is what the old path check did.
          $candidates = @(
            (Join-Path $buildDir "$cfg\normalizer.exe"),
            (Join-Path $buildDir "normalizer.exe")
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "normalizer.exe was not produced. Looked in: $($candidates -join ', ')"
          }
          Write-Host ("  -> {0}  {1:N0} bytes" -f $exe, (Get-Item $exe).Length)

          # Publish the resolved path so the smoke test and the staging step
          # cannot each re-derive it differently.
          "NORMALIZER_EXE=$exe" >> $env:GITHUB_ENV

      # Same trap as the Rust smoke test, one step further down. A usage error is the
      # CORRECT response to no arguments, so a non-zero exit here is expected
      # behaviour rather than a build failure -- but the bare native call was the
      # last command in the step, so GitHub's appended `exit $LASTEXITCODE` turned
      # normalizer's own usage exit code into a red step. Assert that it starts
      # and prints usage instead, then exit 0 explicitly.
      #
      # The path is resolved rather than hardcoded: the build step above already
      # has to cope with a single-config generator writing straight to build/ and
      # a multi-config one writing build/$cfg/, so this must accept both.
      - name: Smoke-test normalizer.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # The path comes from the build step through GITHUB_ENV, so this check
          # cannot disagree with where the binary actually landed.
          $exe = $env:NORMALIZER_EXE
          if (-not $exe -or -not (Test-Path $exe)) {
            throw "NORMALIZER_EXE was not set by the build step (got '$exe')"
          }

          $out = (& $exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $say = (($out -split "\r?\n") | Where-Object { $_.Trim() } | Select-Object -First 1)
          Write-Host ("  normalizer       exit={0,-4} {1}" -f $code, $say)

          if ($out -notmatch "(?i)usage") {
            throw "normalizer.exe did not print a usage line. Output was: $out"
          }
          Write-Host "normalizer starts and prints usage"
          exit 0

      - name: Stamp build time
        id: now
        shell: pwsh
        run: |
          $stamp = Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ'
          "stamp=$stamp" >> $env:GITHUB_OUTPUT
          Write-Host "build stamp: $stamp"

      # Everything lands in one flat directory: upload-artifact v4 preserves the
      # directory tree under `path`, so without this staging copy the download
      # would be three nested target/release folders instead of four loose .exe.
      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist\windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($crate in @("stitcher", "subtitle_forge", "havaldar_core")) {
            Copy-Item "$crate\target\release\$crate.exe" "$stage\$crate.exe" -Force
          }
          # normalizer now lives in an out-of-tree build directory whose path is
          # chosen by the build step, so it has to be passed along rather than
          # reconstructed. A hardcoded guess here is how the staged artifact
          # would silently go missing while every earlier step stayed green.
          if (-not $env:NORMALIZER_EXE -or -not (Test-Path $env:NORMALIZER_EXE)) {
            throw "NORMALIZER_EXE missing -- cannot stage normalizer.exe"
          }
          Copy-Item $env:NORMALIZER_EXE "$stage\normalizer.exe" -Force

          # A manifest makes a downloaded artifact self-describing: which commit,
          # which host, which SHA-256. Four loose .exe files in a Downloads
          # folder are otherwise unattributable.
          #
          # Built with ConvertTo-Json, not string interpolation: in a PowerShell
          # plain string "{{" is two literal braces (brace escaping is a C#
          # format-string convention, not a PowerShell one), so hand-rolled JSON
          # silently emits invalid output.
          $binaries = @(
            Get-ChildItem "$stage\*.exe" | Sort-Object Name | ForEach-Object {
              [ordered]@{
                name   = $_.Name
                bytes  = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            }
          )
          $manifest = [ordered]@{
            artifact = "windows-native-tools"
            commit   = "${{ github.sha }}"
            ref      = "${{ github.ref_name }}"
            built    = "${{ steps.now.outputs.stamp }}"
            os       = "windows-x86_64"
            binaries = $binaries
          }
          $manifest | ConvertTo-Json -Depth 5 |
            Out-File -FilePath "$stage\manifest.json" -Encoding utf8
          Get-Content "$stage\manifest.json"

          # Prove it parses before uploading. A corrupt manifest is worse than
          # none, because it looks authoritative.
          Get-Content "$stage\manifest.json" -Raw | ConvertFrom-Json | Out-Null
          Write-Host "manifest.json parses OK"

      - name: Upload windows-native-tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-tools
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # JOB 2 -- the Kaggle pack
  # ===========================================================================
  kaggle-tdubber-pack:
    name: Kaggle pack (5 static linux/amd64 binaries)
    runs-on: ubuntu-latest
    # Only the stages pack-exporter depends on are built, so the ~5 GB
    # torch/vLLM `brain` stage is never pulled. Minutes, not an hour.
    timeout-minutes: 45
    needs: []          # intentional: independent of job 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The pack builds all six binaries from source inside Docker, so every
      # source tree must reach the build context. Matched exactly (`-x`) so a
      # narrower rule such as `cpp_accelerator/build/`, which excludes output
      # rather than sources, does not false-positive here.
      - name: Verify sources are in the build context
        run: |
          set -euo pipefail
          for d in stitcher subtitle_forge havaldar_core cpp_accelerator edge cmd; do
            if grep -qxE "${d}/" .dockerignore; then
              echo "::error file=.dockerignore::${d}/ excludes sources the pack stage needs"
              exit 1
            fi
            if [ ! -d "$d" ]; then
              echo "::error::${d}/ is not in the checkout"
              exit 1
            fi
            echo "ok: ${d}/ present in the build context"
          done

      # Buildx local cache, so the Rust and C++ compiles are not redone on every
      # push. Keyed on the Dockerfile plus every source tree feeding the arsenal.
      #
      # This cache only works because the build step below passes the matching
      # --cache-from/--cache-to pair. Saving a path that no build command ever
      # names produces a green cache restore that restores nothing: the key
      # still hits, the layers still miss, and the saving looks like it is
      # working. Both halves have to be edited together or neither helps.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-kaggle-pack-${{ hashFiles('Dockerfile', '.dockerignore', 'stitcher/**', 'subtitle_forge/**', 'havaldar_core/**', 'cpp_accelerator/**', 'main.go', 'upload.go', 'fetch.go', 'commands.go', 'main_entry.go', 'go.mod', 'go.sum', 'edge/**', 'cmd/edge-fetch/**') }}
          restore-keys: |
            ${{ runner.os }}-kaggle-pack-

      # `--output type=local` is the point of this job.
      #
      # The pack-exporter stage is `FROM scratch`, so BuildKit writes its
      # filesystem straight to ./pack: no image to load, no `docker cp`, no
      # layers to strip. Only the stages pack-exporter depends on are built --
      # go-transporter, rust-arsenal, cpp-forge, pack-manifest -- so the 5 GB
      # `brain` stage with torch and vLLM is never pulled.
      #
      # `--load` is deliberately NOT used: it would materialise the scratch
      # image in the runner's daemon for no benefit.
      #
      # `set -e` is deliberately NOT used around the build. A `--progress=plain`
      # log for five compilers is thousands of lines, so when a build breaks the
      # reason is long scrolled off the top of the collapsed step -- which is why
      # this failure looked mysterious. The log is teed to a file and its tail,
      # plus the Dockerfile stage headers, are printed on failure, so the next
      # run names the stage that broke without anyone downloading logs.
      - name: Build and export the pack (type=local)
        run: |
          set -uo pipefail
          rm -rf pack pack-export

          args=(
            buildx build
            --target pack-exporter
            # NOTE the destination: `./pack-export`, NOT `./pack`.
            #
            # `--output type=local` writes the image's ROOT FILESYSTEM into dest,
            # and pack-exporter is `FROM scratch` with
            # `COPY --from=pack-manifest /pack /pack` -- so the image root holds a
            # `/pack` directory. Exporting straight to ./pack therefore yields
            # ./pack/pack/bin/... , and the verify step below then cannot find
            # pack/MANIFEST.txt even though the build fully succeeded.
            #
            # build_kaggle_pack.ps1 is the reference contract and gets this right:
            # it exports to a staging directory (line 112) and then reads
            # `$Staging/pack` (line 115). Its `docker create` + `docker cp`
            # fallback lands in the same place (line 128). This workflow was the
            # only caller that named the pack folder directly, which is why it was
            # the only one that broke.
            #
            # So: export somewhere neutral, then normalise, and every later step
            # sees the documented `pack/` shape unchanged.
            --output type=local,dest=./pack-export
            --progress=plain
            --metadata-file /tmp/buildmeta.json
          )
          # Only offer the importer when the restore actually produced a
          # directory; pointing --cache-from at a missing path is an error on
          # some buildx versions and a warning on others.
          if [ -d /tmp/.buildx-cache ]; then
            args+=(--cache-from type=local,src=/tmp/.buildx-cache)
          else
            echo "no local buildx cache present; building cold"
          fi
          args+=(--cache-to type=local,dest=/tmp/.buildx-cache,mode=max)

          docker "${args[@]}" . 2>&1 | tee /tmp/pack-build.log
          rc=${PIPESTATUS[0]}

          if [ "$rc" -ne 0 ]; then
            echo "::error::pack build failed (docker buildx exit $rc)"

            # Print context AROUND the first real failure, not just the tail.
            # A `--progress=plain` log for five compilers runs to thousands of
            # lines and the reason is buried in the middle; the tail only ever
            # shows BuildKit's own ERROR summary, which names the failing
            # Dockerfile line but never says what went wrong there.
            first=$(grep -nE 'ASSERT FAIL|error\[E[0-9]+\]|(^|[^a-zA-Z])error:|not found|panicked|No such file|cannot find' /tmp/pack-build.log \
                    | grep -vE 'does not support target|ERROR: failed to build|failed to solve' \
                    | head -n 1 | cut -d: -f1)
            if [ -n "$first" ]; then
              start=$(( first > 14 ? first - 14 : 1 ))
              echo "----- context around the first failure (log line $first) -----"
              sed -n "${start},$(( first + 30 ))p" /tmp/pack-build.log
              echo "----- end context -----"
            else
              echo "no recognisable error line found; showing the last 60 lines"
            fi

            echo "----- error-ish lines across the whole log -----"
            grep -nE 'ASSERT FAIL|error\[E[0-9]+\]|(^|[^a-zA-Z])error:|not found|panicked' /tmp/pack-build.log | head -n 40 || true

            echo "----- Dockerfile stage headers seen in this build -----"
            grep -nE '^#[0-9]+ \[|^#[0-9]+ (FROM|DONE|CACHED)|--- (Stage|STAGE)' /tmp/pack-build.log | tail -n 30 || true

            echo "----- last 40 lines of the build log -----"
            tail -n 40 /tmp/pack-build.log
            echo "----- end of build log -----"
            exit "$rc"
          fi
          echo "pack build succeeded"

          # Normalise the export into the documented `pack/` shape.
          #
          # This accepts EITHER shape rather than assuming one. A plain `mv
          # ./pack-export/pack ./pack` is correct today, but it fails confusingly
          # if the image layout ever changes: if pack-exporter were altered to
          # `COPY ... /pack /`, the export would arrive as
          # ./pack-export/MANIFEST.txt and the blind mv would just report a
          # missing source directory. Keying off the marker file means this step
          # either produces the right layout or prints what it actually got.
          #
          # MANIFEST.txt is that marker because pack-manifest always writes it,
          # and its absence from the expected place is the exact failure this
          # normalisation exists to prevent.
          rm -rf pack
          if [ -f ./pack-export/pack/MANIFEST.txt ]; then
            mv ./pack-export/pack ./pack
            rm -rf ./pack-export
          elif [ -f ./pack-export/MANIFEST.txt ]; then
            # The image root already IS the pack; there is no nesting to undo.
            mv ./pack-export ./pack
          else
            echo "::error::MANIFEST.txt not found in the export; refusing to normalise blindly"
            echo "--- what was actually exported ---"
            find ./pack-export -maxdepth 4 2>/dev/null | sort || true
            exit 1
          fi
          echo "export normalised to:"
          find pack -type f | sort

      # pack-manifest already runs each binary and asserts it is static via ldd.
      # This re-verifies the EXPORTED bytes, because `type=local` writes a plain
      # directory: a truncated or mis-serialised export would otherwise reach
      # Kaggle unnoticed.
      - name: Verify the exported pack
        run: |
          set -euo pipefail
          echo "=== pack tree ==="
          find pack -type f | sort

          for f in pack/MANIFEST.txt pack/SHA256SUMS; do
            [ -f "$f" ] || { echo "::error::${f} is missing from the export"; exit 1; }
          done

          echo "=== MANIFEST.txt (written by the pack-manifest stage) ==="
          cat pack/MANIFEST.txt

          # End-to-end integrity: the checksums the Dockerfile produced, checked
          # against the bytes that actually landed on disk.
          echo "=== verifying SHA256SUMS ==="
          ( cd pack/bin && sha256sum -c ../SHA256SUMS )

          fail=0
          for b in tgup edge-fetch stitcher subtitle_forge havaldar_core normalizer; do
            p="pack/bin/${b}"
            if [ ! -f "$p" ]; then echo "::error::missing ${p}"; fail=1; continue; fi
            chmod +x "$p"
            printf '  %-16s %10s bytes  %s\n' "$b" "$(stat -c%s "$p")" \
              "$(file -b "$p" 2>/dev/null | cut -c1-64 || echo '?')"
          done
          [ $fail -eq 0 ] || exit 1

      # tar.gz, not zip: the pack is a Linux tree, and zip's 4 GB cap plus
      # weaker compression would both bite as soon as a venv is added.
      - name: Compress the pack
        run: |
          set -euo pipefail
          tar -czf kaggle-tdubber-pack.tar.gz -C pack .
          ls -lh kaggle-tdubber-pack.tar.gz
          # Checksum of the archive itself, so a download can be verified before
          # anyone mounts it on Kaggle.
          sha256sum kaggle-tdubber-pack.tar.gz | tee kaggle-tdubber-pack.tar.gz.sha256

      - name: Upload kaggle-tdubber-pack
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-tdubber-pack
          path: kaggle-tdubber-pack.tar.gz
          if-no-files-found: error
          retention-days: 30

      # The manifest and checksums are tiny, so they get their own artifact: you
      # can read what a build produced without downloading the pack at all.
      - name: Upload pack manifest (small)
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-tdubber-pack-manifest
          path: |
            pack/MANIFEST.txt
            pack/SHA256SUMS
            kaggle-tdubber-pack.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Kaggle pack built"
            echo ""
            echo '```'
            cat pack/MANIFEST.txt
            echo '```'
            echo ""
            echo "archive: \`kaggle-tdubber-pack.tar.gz\` ($(du -h kaggle-tdubber-pack.tar.gz | cut -f1))"
            echo ""
            echo "Download the artifact, publish it as a Kaggle Dataset, and mount it"
            echo "in the kernel. The pack is six static linux/amd64 binaries only --"
            echo "it does **not** contain the Python venv, so the notebook still"
            echo "installs torch/vLLM unless you mount that as a second Dataset."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # JOB 3 -- stdlib-only Python tests
  # ===========================================================================
  #  The repo has ~22 test scripts and CI ran NONE of them. Most cannot run
  #  here: they need telethon, gradio, a running dashboard, a Telegram account
  #  or a Kaggle credential. Five can, and they are the whole point of this
  #  job:
  #
  #    test_ui_static.py                       browser-asset contract
  #    tests/test_subtitle_forge_timecode.py    SRT/ASS timestamp math
  #    tests/test_subtitle_forge_wrapping.py    greedy wrap vs optimal lines
  #    tests/test_subtitle_forge_render.py      the render contract itself
  #    tests/lint_subtitle_forge_source.py      structural lint of main.rs
  #
  #  All five import only the standard library plus repo-local modules -- no
  #  pip install step exists here on purpose. If a future edit makes one of
  #  them need a third-party package, this job fails at import and that is the
  #  correct signal: the test stopped being a free gate.
  #
  #  Deliberately `needs: []` like the other two, and deliberately the cheapest
  #  runner: this is the one job worth blocking a merge on.
  python-tests:
    name: Python tests (stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ubuntu-latest ships several Pythons; pick one explicitly so a runner
      # image bump cannot silently change which interpreter runs the suite.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Run from the repo root: test_ui_static.py imports ui_static from here.
      # `-B` keeps __pycache__ from being written into the checkout.
      - name: Run stdlib-only tests
        run: |
          set -euo pipefail
          status=0
          for t in \
              test_ui_static.py \
              tests/test_subtitle_forge_timecode.py \
              tests/test_subtitle_forge_wrapping.py \
              tests/test_subtitle_forge_render.py \
              tests/lint_subtitle_forge_source.py
          do
            echo "::group::${t}"
            if python -B "${t}"; then
              echo "PASS ${t}"
            else
              echo "::error::FAIL ${t}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"